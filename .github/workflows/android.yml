# Automatické zostavenie Android appky a spustenie testov pri každej zmene.
# Hotová appka (APK) sa dá stiahnuť z výsledku behu v časti „Artifacts“.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zostavenie:
    name: Zostavenie a testy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Stiahnutie kódu
        uses: actions/checkout@v4

      - name: Príprava Javy
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Príprava nástroja Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testy logiky
        run: ./gradlew --console=plain testDebugUnitTest

      - name: Zostavenie appky
        run: ./gradlew --console=plain assembleDebug

      - name: Uloženie appky (APK)
        uses: actions/upload-artifact@v4
        with:
          name: weup-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Uloženie výsledkov testov pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vysledky-testov
          path: android/app/build/reports/tests/
